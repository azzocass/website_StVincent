name: Deploy to OVH

on:
  # Déploiement MANUEL uniquement depuis l'onglet Actions sur GitHub.com
  # Changer en "push: branches: [main]" quand prêt pour le déploiement automatique
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
    
    - name: 📂 Sync files to OVH
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        # Si le site n'est pas à la racine du FTP OVH (ex: dans un dossier www), on peut l'indiquer ici :
        # server-dir: /www/
