name: Deploy to OVH

on:
  # Déploiement MANUEL uniquement depuis l'onglet Actions sur GitHub.com
  # Changer en "push: branches: [main]" quand prêt pour le déploiement automatique
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
    
    - name: 📂 Sync files to OVH via SFTP
      uses: SamKirkland/FTP-Deploy-Action@v4.4.0
      with:
        dry-run: true
        protocol: ftps
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 22
        server-dir: /home/ecolesaiqo/www/
        exclude: |
          **/.git*
          **/.git*/**
          **/.github
          **/.github/**

